[package]
name = "camviewer"
version = "0.4.3"
edition = "2024"
description = "A lean RTSP camera viewer for Windows, Linux and macOS"
license = "MIT"

[dependencies]
# One dependency for all of GPUI, the styled component library and the icons.
gpui-kit = "0.7"
# Raw frame buffers. Must stay on the same major version as GPUI's own `image`.
image = "0.25"
# Drives the ffmpeg executable and reads raw frames from its stdout.
ffmpeg-sidecar = "2.6"
# Audio playback. No decoders are needed: ffmpeg already outputs raw PCM.
rodio = { version = "0.23", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
smallvec = "1.16.3"
ureq = "3.4.2"
self-replace = "1.5.0"

[dev-dependencies]
# GPUI's test harness: headless windows, synthetic clicks and typing, and
# assertions on focus and layout. See tests/ui.rs.
#
# It is switched on through these three crates rather than through
# `gpui-kit/test-support`, which does not resolve. The versions must match the
# ones gpui-kit pulls, so cargo turns the feature on for the same crate
# instances; AGENTS.md explains why.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
gpui-base = { version = "0.7.3", features = ["test-support"] }
gpui-component = { version = "0.7.3", features = ["test-support"] }

# Full debug info made every debug and test executable 400-800 MB, and cargo
# keeps the old ones. Line tables are enough for backtraces in our own code.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
