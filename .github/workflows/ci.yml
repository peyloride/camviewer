name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, lint and test
    # GitHub-hosted on purpose. This repository is public, so a pull request
    # from a stranger would otherwise run its code on a self-hosted machine.
    # Keep the untrusted path on GitHub's hardware. The release workflow,
    # which only a pushed tag starts, is the safe place for a private runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # GPUI, audio and the video path need these at build time.
      - name: Install system packages
        run: |
          # A self-hosted runner may not have sudo; it often runs as root.
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libasound2-dev \
            libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # A version bump and its changelog entry must land together, or the
      # release would publish empty notes. The release workflow enforces the
      # same rule at tag time.
      - name: Check the changelog covers this version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "Cargo.toml says $version"
          ./packaging/release-notes.sh "v$version" > /dev/null

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
